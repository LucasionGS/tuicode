# kitty pass-through for tuicode
#
# kitty's default kitty_mod (ctrl+shift) shortcuts swallow many VS Code shortcuts.
# tuicode sets the "in_editor" user variable while it runs, so these mappings only
# pass the keys through to tuicode and keep kitty's shortcuts everywhere else.
# Include this file from kitty.conf with:  include tuicode.conf

map --when-focus-on var:in_editor kitty_mod+p
map --when-focus-on var:in_editor kitty_mod+e
map --when-focus-on var:in_editor kitty_mod+f
map --when-focus-on var:in_editor kitty_mod+h
map --when-focus-on var:in_editor kitty_mod+g
map --when-focus-on var:in_editor kitty_mod+d
map --when-focus-on var:in_editor kitty_mod+x
map --when-focus-on var:in_editor kitty_mod+l
map --when-focus-on var:in_editor kitty_mod+k
map --when-focus-on var:in_editor kitty_mod+j
map --when-focus-on var:in_editor kitty_mod+u
map --when-focus-on var:in_editor kitty_mod+o
map --when-focus-on var:in_editor kitty_mod+s
map --when-focus-on var:in_editor kitty_mod+b
map --when-focus-on var:in_editor kitty_mod+r
map --when-focus-on var:in_editor kitty_mod+m
map --when-focus-on var:in_editor kitty_mod+a
map --when-focus-on var:in_editor kitty_mod+z
map --when-focus-on var:in_editor kitty_mod+i
map --when-focus-on var:in_editor kitty_mod+t
map --when-focus-on var:in_editor kitty_mod+n
map --when-focus-on var:in_editor kitty_mod+w
map --when-focus-on var:in_editor kitty_mod+enter
map --when-focus-on var:in_editor kitty_mod+left
map --when-focus-on var:in_editor kitty_mod+right
map --when-focus-on var:in_editor kitty_mod+up
map --when-focus-on var:in_editor kitty_mod+down
map --when-focus-on var:in_editor kitty_mod+home
map --when-focus-on var:in_editor kitty_mod+end
map --when-focus-on var:in_editor kitty_mod+page_up
map --when-focus-on var:in_editor kitty_mod+page_down
map --when-focus-on var:in_editor kitty_mod+backslash
map --when-focus-on var:in_editor kitty_mod+delete
map --when-focus-on var:in_editor kitty_mod+5
map --when-focus-on var:in_editor kitty_mod+7
map --when-focus-on var:in_editor kitty_mod+grave
